<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Particle Image – Demo</title>
<style>
  :root {
    --bg: #060010;
    --panel: rgba(255, 255, 255, 0.055);
    --border: rgba(255, 255, 255, 0.12);
    --text: #f2eefe;
    --muted: #9a92b8;
    --accent: #8a5cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 700px at 50% -10%, #150b2e 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    overflow-x: hidden;
  }
  header {
    padding: 22px 28px 6px;
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 20px; font-weight: 650; letter-spacing: 0.4px; }
  header p { color: var(--muted); font-size: 13px; }
  main { flex: 1; display: flex; flex-direction: column; padding: 10px 28px 24px; gap: 16px; }

  #stage {
    position: relative;
    flex: 1;
    min-height: 420px;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: rgba(0, 0, 0, 0.25);
    overflow: hidden;
  }
  #stage.dragover { outline: 2px dashed var(--accent); outline-offset: -8px; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  #hint {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    font-size: 12px; color: var(--muted); background: rgba(6, 0, 16, 0.55);
    padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border);
    pointer-events: none; white-space: nowrap;
  }

  #panel {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 12px 18px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 18px;
    align-items: center;
  }
  .ctl label {
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--muted); margin-bottom: 6px;
  }
  .ctl output { color: var(--text); font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  .buttons { display: flex; gap: 8px; flex-wrap: wrap; }
  button, .filebtn {
    font: inherit; font-size: 13px; color: var(--text);
    background: rgba(138, 92, 255, 0.16);
    border: 1px solid rgba(138, 92, 255, 0.5);
    border-radius: 10px; padding: 8px 14px; cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover, .filebtn:hover { background: rgba(138, 92, 255, 0.32); }
  button.secondary { background: transparent; border-color: var(--border); }
  #stats { font-size: 12px; color: var(--muted); line-height: 1.7; }
  #stats b { color: var(--text); font-weight: 600; }
  input[type="file"] { display: none; }
</style>
</head>
<body>
<header>
  <h1>Particle Image</h1>
  <p>Ein Bild, aufgel&ouml;st in GPU-Partikel, die auseinanderwirbeln und sich wieder zusammensetzen &ndash; Nachbau ohne Abh&auml;ngigkeiten.</p>
</header>

<main>
  <div id="stage">
    <canvas id="fx"></canvas>
    <div id="hint">Maus bewegen = Partikel wegdr&uuml;cken &middot; Klick = Druckwelle &middot; eigenes Bild einfach hierher ziehen</div>
  </div>

  <div id="panel">
    <div class="ctl">
      <label>Partikel-Abstand (Gap) <output id="vGap">4</output></label>
      <input id="gap" type="range" min="2" max="14" step="1" value="4">
    </div>
    <div class="ctl">
      <label>Partikel-Gr&ouml;&szlig;e <output id="vSize">2</output></label>
      <input id="size" type="range" min="1" max="6" step="0.5" value="2">
    </div>
    <div class="ctl">
      <label>Maus-Radius <output id="vRadius">110</output></label>
      <input id="radius" type="range" min="0" max="300" step="5" value="110">
    </div>
    <div class="ctl">
      <label>Maus-St&auml;rke <output id="vStrength">9</output></label>
      <input id="strength" type="range" min="0" max="30" step="1" value="9">
    </div>
    <div class="ctl">
      <label>Reibung <output id="vFriction">0.86</output></label>
      <input id="friction" type="range" min="0.70" max="0.97" step="0.01" value="0.86">
    </div>
    <div class="ctl">
      <label>Wirbel-St&auml;rke <output id="vSwirl">1.0</output></label>
      <input id="swirl" type="range" min="0" max="3" step="0.1" value="1">
    </div>
    <div class="buttons">
      <button id="toggle">Aufl&ouml;sen</button>
      <button id="replay" class="secondary">Intro erneut abspielen</button>
      <label class="filebtn" for="file">Eigenes Bild &hellip;</label>
      <input id="file" type="file" accept="image/*">
    </div>
    <div id="stats">
      Partikel: <b id="sCount">&ndash;</b> &middot; Renderer: <b id="sRenderer">&ndash;</b><br>
      FPS: <b id="sFps">&ndash;</b>
    </div>
  </div>
</main>

<script src="particle-image.js"></script>
<script>
(function () {
  'use strict';

  // ------------------------------------------------ Beispielbild generieren
  // Damit die Demo offline und ohne CORS-Probleme laeuft, wird das
  // Ausgangsbild auf einem Offscreen-Canvas gezeichnet (bunter Schriftzug
  // mit Umlaufbahn) statt eine Datei zu laden.
  function makeArtwork() {
    var w = 1000, h = 560;
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var x = c.getContext('2d');

    // Umlaufbahn-Ellipsen (React-artiges Orbit-Motiv)
    x.save();
    x.translate(w / 2, h / 2);
    x.lineWidth = 10;
    for (var i = 0; i < 3; i++) {
      x.save();
      x.rotate((i * Math.PI) / 3);
      var g = x.createLinearGradient(-w / 2, 0, w / 2, 0);
      g.addColorStop(0, '#22d3ee');
      g.addColorStop(0.5, '#8a5cff');
      g.addColorStop(1, '#f472b6');
      x.strokeStyle = g;
      x.globalAlpha = 0.9;
      x.beginPath();
      x.ellipse(0, 0, w * 0.42, h * 0.16, 0, 0, Math.PI * 2);
      x.stroke();
      x.restore();
    }
    // Kern in der Mitte
    var core = x.createRadialGradient(0, 0, 4, 0, 0, 46);
    core.addColorStop(0, '#ffffff');
    core.addColorStop(0.35, '#c4b5fd');
    core.addColorStop(1, 'rgba(138,92,255,0)');
    x.fillStyle = core;
    x.beginPath();
    x.arc(0, 0, 46, 0, Math.PI * 2);
    x.fill();
    x.restore();

    // Schriftzug mit Farbverlauf
    x.font = '800 150px "Segoe UI", system-ui, sans-serif';
    x.textAlign = 'center';
    x.textBaseline = 'middle';
    var tg = x.createLinearGradient(0, h / 2 - 80, 0, h / 2 + 80);
    tg.addColorStop(0, '#fdf4ff');
    tg.addColorStop(0.5, '#c4b5fd');
    tg.addColorStop(1, '#7c3aed');
    x.lineWidth = 14;
    x.strokeStyle = 'rgba(6,0,16,0.9)'; // dunkler Rand trennt Text von den Bahnen
    x.strokeText('PARTIKEL', w / 2, h / 2);
    x.fillStyle = tg;
    x.fillText('PARTIKEL', w / 2, h / 2);

    // ein paar Sterne drumherum
    for (var s = 0; s < 60; s++) {
      var sx = Math.random() * w, sy = Math.random() * h;
      var d = Math.hypot(sx - w / 2, sy - h / 2);
      if (d < 260) continue;
      x.fillStyle = 'rgba(255,255,255,' + (0.35 + Math.random() * 0.6) + ')';
      var r = 1 + Math.random() * 2.5;
      x.fillRect(sx, sy, r, r);
    }
    return c;
  }

  var canvas = document.getElementById('fx');
  var stage = document.getElementById('stage');
  var sCount = document.getElementById('sCount');
  var sRenderer = document.getElementById('sRenderer');
  var sFps = document.getElementById('sFps');
  var toggleBtn = document.getElementById('toggle');

  var fx = new ParticleImage(canvas, {
    src: makeArtwork(),
    particleGap: 4,
    particleSize: 2,
    mouseRadius: 110,
    mouseStrength: 9,
    friction: 0.86,
    swirl: 1,
    onReady: function (info) {
      sCount.textContent = info.count.toLocaleString('de-DE');
      sRenderer.textContent = info.renderer === 'webgl' ? 'WebGL' : 'Canvas 2D';
    }
  });
  window.fx = fx; // fuer Experimente in der Konsole

  // ------------------------------------------------------------- Bedienung
  function bindRange(id, outId, fmt, apply) {
    var input = document.getElementById(id);
    var out = document.getElementById(outId);
    input.addEventListener('input', function () {
      var v = parseFloat(input.value);
      out.textContent = fmt(v);
      apply(v);
      sCount.textContent = fx.count.toLocaleString('de-DE');
    });
  }
  var plain = function (v) { return String(v); };
  var fixed1 = function (v) { return v.toFixed(1); };
  var fixed2 = function (v) { return v.toFixed(2); };

  bindRange('gap', 'vGap', plain, function (v) { fx.setOptions({ particleGap: v }); });
  bindRange('size', 'vSize', plain, function (v) { fx.setOptions({ particleSize: v }); });
  bindRange('radius', 'vRadius', plain, function (v) { fx.setOptions({ mouseRadius: v }); });
  bindRange('strength', 'vStrength', plain, function (v) { fx.setOptions({ mouseStrength: v }); });
  bindRange('friction', 'vFriction', fixed2, function (v) { fx.setOptions({ friction: v }); });
  bindRange('swirl', 'vSwirl', fixed1, function (v) { fx.setOptions({ swirl: v }); });

  toggleBtn.addEventListener('click', function () {
    fx.toggle();
    toggleBtn.textContent = fx.isAssembled() ? 'Auflösen' : 'Zusammensetzen';
  });

  document.getElementById('replay').addEventListener('click', function () {
    fx.dissolve();
    setTimeout(function () {
      fx.assemble();
      toggleBtn.textContent = 'Auflösen';
    }, 900);
  });

  // ------------------------------------------- eigenes Bild (Datei / Drop)
  function useFile(file) {
    if (!file || file.type.indexOf('image/') !== 0) return;
    var url = URL.createObjectURL(file);
    fx.setImage(url).then(function () {
      URL.revokeObjectURL(url);
      sCount.textContent = fx.count.toLocaleString('de-DE');
      toggleBtn.textContent = 'Auflösen';
    });
  }
  document.getElementById('file').addEventListener('change', function (e) {
    useFile(e.target.files[0]);
    e.target.value = '';
  });
  ['dragover', 'dragenter'].forEach(function (ev) {
    stage.addEventListener(ev, function (e) { e.preventDefault(); stage.classList.add('dragover'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    stage.addEventListener(ev, function (e) { e.preventDefault(); stage.classList.remove('dragover'); });
  });
  stage.addEventListener('drop', function (e) {
    useFile(e.dataTransfer.files && e.dataTransfer.files[0]);
  });

  // ------------------------------------------------------------ FPS-Anzeige
  var frames = 0, lastFps = performance.now();
  (function fpsLoop(now) {
    requestAnimationFrame(fpsLoop);
    frames++;
    if (now - lastFps >= 1000) {
      sFps.textContent = String(frames);
      frames = 0;
      lastFps = now;
    }
  })(performance.now());
})();
</script>
</body>
</html>
