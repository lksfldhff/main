      <text x="232" y="304">bleibt Datenfarbe</text>
      <text x="416" y="304">wird Textfarbe</text>
      <text x="600" y="304">wird Flächenbasis</text>
      <text x="784" y="304">Erfolg / Energie</text>
    </g>
  </g>

  <text x="48" y="356" font-size="12" font-weight="700" letter-spacing="1.2" fill="#8B9CA8">FLÄCHEN — #17301C entsättigt und abgedunkelt</text>
  <g>
    <rect x="48" y="370" width="140" height="64" rx="16" fill="#080D11" stroke="#1E2A2F"></rect>
