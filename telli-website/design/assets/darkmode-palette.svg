<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="Plus Jakarta Sans, -apple-system, Helvetica, Arial, sans-serif">
  <title>telli. — Dark Mode aus der Blau-Palette</title>
  <rect width="1000" height="700" fill="#080D11"></rect>

  <text x="48" y="58" font-size="13" font-weight="700" letter-spacing="1.6" fill="#8B9CA8">TELLI. DARK MODE</text>
  <text x="48" y="98" font-size="30" font-weight="700" letter-spacing="-0.9" fill="#EAF1F7">Dunkelvariante der Blau-Palette</text>
  <text x="48" y="128" font-size="14" font-weight="400" fill="#9DAEBA">#17301C trägt jetzt die Flächen, #EBF2FA den Text — die Rollen kehren sich um.</text>

  <text x="48" y="176" font-size="12" font-weight="700" letter-spacing="1.2" fill="#8B9CA8">ORIGINAL</text>
  <g>
    <rect x="48" y="190" width="172" height="76" rx="18" fill="#064789"></rect>
    <rect x="232" y="190" width="172" height="76" rx="18" fill="#427AA1"></rect>
    <rect x="416" y="190" width="172" height="76" rx="18" fill="#EBF2FA"></rect>
    <rect x="600" y="190" width="172" height="76" rx="18" fill="#17301C"></rect>
    <rect x="784" y="190" width="168" height="76" rx="18" fill="#04724D"></rect>
    <g font-size="12" font-weight="600" fill="#C3D0DA">
      <text x="48" y="286">#064789</text>
      <text x="232" y="286">#427AA1</text>
      <text x="416" y="286">#EBF2FA</text>
      <text x="600" y="286">#17301C</text>
      <text x="784" y="286">#04724D</text>
    </g>
    <g font-size="11" font-weight="400" fill="#8B9CA8">
