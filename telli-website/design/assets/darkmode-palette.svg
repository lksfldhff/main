    <rect x="200" y="538" width="140" height="64" rx="16" fill="#C3D0DA"></rect>
    <rect x="352" y="538" width="140" height="64" rx="16" fill="#8B9CA8"></rect>
    <rect x="504" y="538" width="140" height="64" rx="16" fill="#3C6890"></rect>
