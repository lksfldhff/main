  <g>
    <rect x="48" y="662" width="20" height="20" rx="6" fill="#1A2A2E"></rect>
    <rect x="76" y="662" width="20" height="20" rx="6" fill="#A9C4CF"></rect>
    <rect x="104" y="662" width="20" height="20" rx="6" fill="#182420"></rect>
    <text x="136" y="677" font-size="11" font-weight="400" fill="#8B9CA8">Kein Signalrot: kritische Zustände über Fläche #1A2A2E + Text #A9C4CF. Erfolgsfläche #182420 mit #4FA383. #064789 und #17301C sind auf Dunkel zu dunkel für Text — nur als Fläche verwenden.</text>
